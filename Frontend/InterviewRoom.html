<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intervue | Live Session</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: { primary: '#2563eb', primaryHover: '#1d4ed8' }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col">
  
  <header class="bg-white border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <div class="flex items-center gap-2 text-xl font-bold text-gray-900">
          <div class="w-8 h-8 bg-primary text-white rounded flex items-center justify-center font-bold text-sm">IV</div>
          Intervue Room
        </div>
        <div id="sessionStatus" class="flex items-center gap-2">
            <span class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
            </span>
            <span class="text-sm font-medium text-gray-600">Connecting...</span>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-4xl mx-auto w-full px-4 sm:px-6 py-10 flex flex-col h-full">
    
    <!-- Interview UI Container -->
    <div id="interviewContainer" class="bg-white rounded-2xl border border-gray-200 shadow-xl shadow-gray-200/50 flex flex-col flex-grow relative overflow-hidden hidden">
      
      <!-- Progress Bar -->
      <div class="w-full bg-gray-100 h-1.5 absolute top-0 left-0">
        <div id="progressBar" class="bg-primary h-1.5 w-0 transition-all duration-500"></div>
      </div>

      <!-- Question Display -->
      <div class="p-8 border-b border-gray-100">
        <div class="flex justify-between items-start mb-4">
          <span id="roundBadge" class="inline-block px-3 py-1 bg-blue-50 text-blue-700 text-xs font-bold rounded-full uppercase tracking-wider">Round</span>
          <span id="questionCounter" class="text-sm font-medium text-gray-400">Q 1/1</span>
        </div>
        <h2 id="questionText" class="text-2xl sm:text-3xl font-bold text-gray-900 leading-tight">
          Loading question...
        </h2>
      </div>

      <!-- Transcript & Interaction -->
      <div class="p-8 flex-grow flex flex-col bg-gray-50/50">
        <div class="flex-grow bg-white rounded-xl border border-gray-200 p-6 shadow-inner overflow-y-auto mb-6 min-h-[200px]" id="transcriptBox">
          <p class="text-gray-400 text-center italic mt-10">Your transcribed answer will appear here...</p>
        </div>

        <!-- Controls -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
          
          <button id="recordBtn" class="flex items-center justify-center gap-2 px-6 py-3 bg-red-100 text-red-600 hover:bg-red-200 rounded-full font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed w-full sm:w-auto">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
            <span id="recordBtnText">Start Speaking</span>
          </button>

          <button id="nextBtn" class="flex items-center justify-center gap-2 px-8 py-3 bg-primary text-white hover:bg-primaryHover rounded-xl font-semibold shadow-sm transition-colors disabled:opacity-50 disabled:cursor-not-allowed w-full sm:w-auto">
            Submit Answer
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
          </button>

        </div>
      </div>

    </div>

    <!-- Loading / Error States -->
    <div id="loadingState" class="flex flex-col items-center justify-center flex-grow">
        <svg class="animate-spin h-10 w-10 text-primary mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p class="text-gray-500 font-medium">Initializing session...</p>
    </div>

    <div id="errorState" class="hidden flex-col items-center justify-center flex-grow text-center">
        <svg class="w-16 h-16 text-red-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <h3 class="text-xl font-bold text-gray-900 mb-2">Something went wrong</h3>
        <p id="errorMsg" class="text-gray-500 mb-6">Failed to load the interview session.</p>
        <a href="Interview.html" class="px-6 py-2 bg-gray-900 text-white rounded-lg font-medium hover:bg-gray-800 transition-colors">Return to Setup</a>
    </div>

  </main>

  <script src="config.js"></script>
  <script src="InterviewRoom.js"></script>
</body>
</html>
