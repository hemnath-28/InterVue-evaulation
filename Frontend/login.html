<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intervue - Login & Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            primary: '#2563eb', // blue-600
            primaryHover: '#1d4ed8', // blue-700
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="flex justify-center">
      <a href="index.html" class="flex items-center gap-2 text-2xl font-bold text-gray-900 hover:text-primary transition-colors">
        <div class="w-10 h-10 bg-primary text-white rounded-lg flex items-center justify-center font-bold text-sm shadow-sm">IV</div>
        Intervue
      </a>
    </div>
    <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
      Welcome back
    </h2>
    <p class="mt-2 text-center text-sm text-gray-600">
      Access your AI-powered interview dashboard
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow-xl shadow-gray-200/50 sm:rounded-2xl sm:px-10 border border-gray-100">
      
      <!-- Toggle Login / Sign Up -->
      <div class="flex p-1 space-x-1 bg-gray-100/80 rounded-xl mb-8">
        <button id="btn-login" onclick="switchTab('login')" class="w-full rounded-lg py-2.5 text-sm font-semibold leading-5 text-gray-700 transition-all focus:outline-none focus:ring-2 focus:ring-primary/50 shadow bg-white ring-1 ring-gray-900/5">Log In</button>
        <button id="btn-signup" onclick="switchTab('signup')" class="w-full rounded-lg py-2.5 text-sm font-medium leading-5 text-gray-500 hover:text-gray-700 hover:bg-gray-50 transition-all focus:outline-none">Sign Up</button>
      </div>

      <!-- Login Section -->
      <div id="section-login" class="block animate-in fade-in slide-in-from-bottom-2 duration-300">
        <form class="space-y-6" action="/api/auth/login" method="POST">
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
            <div class="mt-1">
              <input id="email" name="email" type="email" autocomplete="email" required class="appearance-none block w-full px-3 py-2.5 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm transition-colors">
            </div>
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
            <div class="mt-1">
              <input id="password" name="password" type="password" autocomplete="current-password" required class="appearance-none block w-full px-3 py-2.5 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm transition-colors">
            </div>
          </div>

          <div>
            <button type="submit" class="w-full flex justify-center items-center gap-2 py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-primary hover:bg-primaryHover focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors">
              Sign In
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
          </div>
        </form>

        <div class="mt-6">
          <div class="relative">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-gray-200"></div>
            </div>
            <div class="relative flex justify-center text-sm">
              <span class="px-2 bg-white text-gray-500 uppercase tracking-widest text-xs font-semibold">Or continue with</span>
            </div>
          </div>

          <div class="mt-6 grid grid-cols-2 gap-3">
            <a href="/api/auth/google" class="w-full inline-flex justify-center py-2.5 px-4 border border-gray-300 rounded-lg shadow-sm bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">
              <span class="sr-only">Sign in with Google</span>
              <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            </a>
            <a href="/api/auth/github" class="w-full inline-flex justify-center py-2.5 px-4 border border-gray-300 rounded-lg shadow-sm bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">
              <span class="sr-only">Sign in with GitHub</span>
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd" /></svg>
            </a>
          </div>
        </div>
      </div>

      <!-- Signup Section -->
      <div id="section-signup" class="hidden animate-in fade-in slide-in-from-bottom-2 duration-300">
        <form class="space-y-6" action="https://intervue-evaulation.onrender.com/api/auth/register" method="POST">
          <div>
            <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
            <div class="mt-1">
              <input id="name" name="name" type="text" required class="appearance-none block w-full px-3 py-2.5 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm transition-colors">
            </div>
          </div>

          <div>
            <label for="signup-email" class="block text-sm font-medium text-gray-700">Email address</label>
            <div class="mt-1">
              <input id="signup-email" name="email" type="email" autocomplete="email" required class="appearance-none block w-full px-3 py-2.5 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm transition-colors">
            </div>
          </div>

          <div>
            <label for="signup-password" class="block text-sm font-medium text-gray-700">Password</label>
            <div class="mt-1">
              <input id="signup-password" name="password" type="password" autocomplete="new-password" required class="appearance-none block w-full px-3 py-2.5 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm transition-colors">
            </div>
          </div>

          <div>
            <button type="submit" class="w-full flex justify-center items-center gap-2 py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-colors">
              Create Account
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            </button>
          </div>
        </form>
      </div>

    </div>
  </div>

  <script src="config.js"></script>
  <script>
    function switchTab(tab) {
      const btnLogin = document.getElementById('btn-login');
      const btnSignup = document.getElementById('btn-signup');
      const sectionLogin = document.getElementById('section-login');
      const sectionSignup = document.getElementById('section-signup');

      if (tab === 'login') {
        btnLogin.className = "w-full rounded-lg py-2.5 text-sm font-semibold leading-5 text-gray-700 transition-all focus:outline-none focus:ring-2 focus:ring-primary/50 shadow bg-white ring-1 ring-gray-900/5";
        btnSignup.className = "w-full rounded-lg py-2.5 text-sm font-medium leading-5 text-gray-500 hover:text-gray-700 hover:bg-gray-50 transition-all focus:outline-none";
        sectionLogin.classList.remove('hidden');
        sectionLogin.classList.add('block');
        sectionSignup.classList.remove('block');
        sectionSignup.classList.add('hidden');
      } else {
        btnSignup.className = "w-full rounded-lg py-2.5 text-sm font-semibold leading-5 text-gray-700 transition-all focus:outline-none focus:ring-2 focus:ring-emerald-500/50 shadow bg-white ring-1 ring-gray-900/5";
        btnLogin.className = "w-full rounded-lg py-2.5 text-sm font-medium leading-5 text-gray-500 hover:text-gray-700 hover:bg-gray-50 transition-all focus:outline-none";
        sectionSignup.classList.remove('hidden');
        sectionSignup.classList.add('block');
        sectionLogin.classList.remove('block');
        sectionLogin.classList.add('hidden');
      }
    }

    // ─── Dynamic API URLs & Auth error banner ───────────
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.querySelector('#section-login form');
      const signupForm = document.querySelector('#section-signup form');
      const googleBtn = document.querySelector('a[href*="/api/auth/google"]');
      const githubBtn = document.querySelector('a[href*="/api/auth/github"]');

      if (loginForm) loginForm.action = `${API_BASE_URL}/api/auth/login`;
      if (signupForm) signupForm.action = `${API_BASE_URL}/api/auth/register`;
      if (googleBtn) googleBtn.href = `${API_BASE_URL}/api/auth/google`;
      if (githubBtn) githubBtn.href = `${API_BASE_URL}/api/auth/github`;

      const params = new URLSearchParams(window.location.search);
      if (params.get('auth_error') === '1') {
        const banner = document.createElement('div');
        banner.className = 'mb-4 rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700 font-medium text-center';
        banner.textContent = 'You must be logged in to access that page. Please sign in below.';
        const card = document.querySelector('.bg-white.py-8');
        if (card) card.insertBefore(banner, card.firstChild);
      }
    });
  </script>
</body>
</html>
