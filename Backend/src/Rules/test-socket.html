<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepgram Realtime Test</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        .box { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
        button { padding: 10px 15px; margin-right: 10px; cursor: pointer; }
        #transcripts { background: #f9f9f9; padding: 10px; min-height: 100px; }
        .partial { color: gray; font-style: italic; }
        .final { color: black; font-weight: bold; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>

    <h2>AI Realtime Speech Pipeline Test</h2>
    <div class="box">
        <button id="connectBtn">1. Connect & Start Mic (STT)</button>
        <button id="disconnectBtn" disabled>Disconnect</button>
        <p><strong>Status:</strong> <span id="status">Disconnected</span></p>
    </div>

    <div class="box">
        <h3>Transcripts (You speak -> Backend -> Deepgram -> Here)</h3>
        <div id="transcripts"></div>
    </div>

    <div class="box">
        <h3>Text-to-Speech Test</h3>
        <input type="text" id="ttsInput" value="Hello! This is an AI voice generated by Deepgram." style="width: 80%; padding: 8px;" />
        <br><br>
        <button id="ttsBtn">2. Generate & Play Audio (TTS)</button>
    </div>

    <script>
        let socket;
        let mediaRecorder;

        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const ttsBtn = document.getElementById('ttsBtn');
        const statusEl = document.getElementById('status');
        const transcriptsEl = document.getElementById('transcripts');

        connectBtn.onclick = async () => {
            // Connect to Socket.io namespace
            socket = io('http://localhost:3000/interview');

            socket.on('connect', () => {
                statusEl.innerText = 'Connected! Please speak into your microphone...';
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;

                // Tell backend we started
                socket.emit('interview:start', { interviewId: 'test-123' });
            });

            socket.on('disconnect', () => {
                statusEl.innerText = 'Disconnected.';
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
            });

            socket.on('interview:error', (err) => {
                alert("Error from server: " + err.message);
            });

            // Handle incoming transcripts (STT)
            let currentPartial = null;

            socket.on('transcript:partial', (data) => {
                if (!currentPartial) {
                    currentPartial = document.createElement('span');
                    currentPartial.className = 'partial';
                    transcriptsEl.appendChild(currentPartial);
                }
                currentPartial.innerText = data.text + " ";
            });

            socket.on('transcript:final', (data) => {
                if (currentPartial) {
                    currentPartial.remove();
                    currentPartial = null;
                }
                const finalSpan = document.createElement('span');
                finalSpan.className = 'final';
                finalSpan.innerText = data.text;
                transcriptsEl.appendChild(finalSpan);
                
                // Auto scroll
                transcriptsEl.scrollTop = transcriptsEl.scrollHeight;
            });

            // Handle incoming audio question (TTS)
            socket.on('question:audio', (data) => {
                statusEl.innerText = 'Received Audio! Playing...';
                
                try {
                    // Socket.IO sends Node Buffer as a plain object with numeric keys.
                    // Convert it back to Uint8Array before creating Blob.
                    let audioData = data.audio;

                    if (!(audioData instanceof ArrayBuffer) && !(audioData instanceof Uint8Array)) {
                        // Reconstruct Uint8Array from the object
                        const values = Object.values(audioData);
                        audioData = new Uint8Array(values);
                    }

                    const blob = new Blob([audioData], { type: 'audio/mpeg' }); // mp3
                    const url = URL.createObjectURL(blob);
                    const audio = new Audio(url);
                    audio.play().catch(e => {
                        console.error('Audio play error:', e);
                        statusEl.innerText = 'Audio play failed: ' + e.message;
                    });

                    audio.onended = () => {
                        statusEl.innerText = 'Connected! Please speak into your microphone...';
                        URL.revokeObjectURL(url); // cleanup memory
                    };
                } catch (e) {
                    console.error('TTS playback error:', e);
                    statusEl.innerText = 'TTS Error: ' + e.message;
                }
            });

            // Capture Microphone
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0 && socket && socket.connected) {
                        socket.emit('candidate:audio', event.data);
                    }
                };

                // Send a chunk every 250ms for real-time streaming
                mediaRecorder.start(250);
            } catch (err) {
                alert("Microphone access denied: " + err.message);
            }
        };

        disconnectBtn.onclick = () => {
            if (mediaRecorder) mediaRecorder.stop();
            if (socket) socket.disconnect();
            statusEl.innerText = 'Disconnected.';
            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
        };

        ttsBtn.onclick = () => {
            if (!socket || !socket.connected) {
                alert("Please connect first!");
                return;
            }
            const text = document.getElementById('ttsInput').value;
            statusEl.innerText = 'Generating audio...';
            socket.emit('question:request', { text });
        };
    </script>
</body>
</html>
